name: tamreedy_patient_app
description: Tamreedy patient app (Flutter, RTL) implementing the approved P01-P09 screens.
publish_to: none
version: 0.2.0+4
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  tamreedy_core:
    path: ../../packages/flutter_core
  dio: ^5.0.0
  geolocator: ^14.0.0
  uuid: ^4.0.0
  flutter_localizations:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 23
