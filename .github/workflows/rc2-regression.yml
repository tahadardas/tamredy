name: RC2 regression
on:
  workflow_dispatch:
  push:
    branches: [feature/tamreedy-rc2-regression-closure]
permissions:
  contents: read
concurrency:
  group: rc2-${{ github.ref }}
  cancel-in-progress: false
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgis/postgis:18-3.7
        env:
          POSTGRES_USER: rc2_test
          POSTGRES_PASSWORD: isolated_ci_only
          POSTGRES_DB: tamreedy_test_rc2
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rc2_test -d tamreedy_test_rc2"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://rc2_test:isolated_ci_only@127.0.0.1:5432/tamreedy_test_rc2
      TEST_UPGRADE_DATABASE_URL: postgresql://rc2_test:isolated_ci_only@127.0.0.1:5432/tamreedy_test_upgrade_rc2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.13.0'
      - run: npm install --global pnpm@10.14.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter @tamreedy/api build && pnpm --filter @tamreedy/worker build
      - name: Migrate isolated PostgreSQL and prepare upgrade database
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          PGPASSWORD: isolated_ci_only
        run: |
          node infra/db/migrate.mjs
          psql -h 127.0.0.1 -U rc2_test -d postgres -c 'CREATE DATABASE tamreedy_test_upgrade_rc2'
      - name: Full API and PostgreSQL regression
        run: pnpm exec node --test --test-concurrency=2 apps/api/tests/*.test.mjs apps/api/tests/concurrency.integration.mjs
      - name: Full worker regression
        run: pnpm exec node --test --test-concurrency=2 apps/worker/tests/*.test.mjs
      - name: Single replica Socket.IO load and session isolation
        env:
          RUN_RC2_SOCKET_LOAD: 'true'
        run: pnpm exec node --test apps/api/tests/rc2-socket-load.integration.mjs
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install exact Flutter SDK used for local verification
        run: |
          git clone --depth 1 --branch 3.44.0 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter config --no-analytics
      - name: Core, patient and nurse analysis and tests
        run: |
          for package in packages/flutter_core apps/patient_app apps/nurse_app; do
            (cd "$package" && flutter pub get && flutter analyze --no-pub && flutter test --no-pub)
          done
