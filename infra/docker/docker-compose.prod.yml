# Production stack: PostGIS + Redis + migrations + API + worker + admin dashboard.
#   cp infra/docker/.env.prod.example infra/docker/.env      (then edit the values)
#   docker compose -f infra/docker/docker-compose.prod.yml --env-file infra/docker/.env up -d --build
# Only 127.0.0.1 ports are published; put HTTPS in front with Plesk (see docs/DEPLOY_PLESK_AR.md).
name: tamreedy

x-runtime-env: &runtime-env
  LIVE_LOCATION_REDIS_ENABLED: ${LIVE_LOCATION_REDIS_ENABLED:-false}
  LOCATION_POSTGRES_FALLBACK_ENABLED: ${LOCATION_POSTGRES_FALLBACK_ENABLED:-true}
  SCHEDULED_VISITS_ENABLED: ${SCHEDULED_VISITS_ENABLED:-false}
  OPEN_MARKETPLACE_ENABLED: ${OPEN_MARKETPLACE_ENABLED:-true}
  OPEN_DISPATCH_ENABLED: ${OPEN_DISPATCH_ENABLED:-false}
  GUARDIAN_NIGHT_POLICY_ENABLED: ${GUARDIAN_NIGHT_POLICY_ENABLED:-false}
  GUARDIAN_ROUTING_ENABLED: ${GUARDIAN_ROUTING_ENABLED:-false}
  PUSH_ENABLED: ${PUSH_ENABLED:-true}
  REALTIME_ENABLED: ${REALTIME_ENABLED:-true}
  VOICE_ENABLED: ${VOICE_ENABLED:-true}
  TAMREEDY_RELEASE: ${TAMREEDY_RELEASE:-3.1.0-rc.3}

x-api-env: &api-env
  <<: *runtime-env
  NODE_ENV: production
  DATABASE_URL: postgresql://tamreedy:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/tamreedy
  REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (>=32 chars)}
  JWT_ISSUER: tamreedy-api
  JWT_AUDIENCE: tamreedy-mobile
  API_PORT: "3000"
  UPLOADS_DIR: /data/uploads
  GUARDIAN_EVIDENCE_KEY: ${GUARDIAN_EVIDENCE_KEY:-}
  DOCS_ENC_KEY: ${DOCS_ENC_KEY:?set DOCS_ENC_KEY (64 hex chars)}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?set ALLOWED_ORIGINS}
  ALLOW_LEGACY_UNBOUND_SESSIONS: "false"
  ENFORCE_SSL: "true"
  AUTH_MODE: ${AUTH_MODE:-password}
  MAPS_PROVIDER: ${MAPS_PROVIDER:-osm}
  ORS_API_KEY: ${ORS_API_KEY:-}
  GOOGLE_MAPS_SERVER_KEY: ${GOOGLE_MAPS_SERVER_KEY:-}
  TURN_URLS: ${TURN_URLS:?set TURN_URLS}
  TURN_SHARED_SECRET: ${TURN_SHARED_SECRET:?set TURN_SHARED_SECRET}
  TURN_CREDENTIAL_TTL_SECONDS: ${TURN_CREDENTIAL_TTL_SECONDS:-900}
  CALL_RING_TIMEOUT_SECONDS: ${CALL_RING_TIMEOUT_SECONDS:-40}
  WALLET_PROVIDER_ENABLED: "false"

services:
  db:
    image: postgis/postgis:18-3.7
    restart: unless-stopped
    mem_limit: 600m   # one runaway service must not take the whole server down
    environment:
      POSTGRES_DB: tamreedy
      POSTGRES_USER: tamreedy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: ["pg:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tamreedy -d tamreedy"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 150m   # one runaway service must not take the whole server down
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    volumes: ["redis:/data"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  coturn:
    image: coturn/coturn:4.6-alpine
    restart: unless-stopped
    mem_limit: 256m
    command:
      - sh
      - -c
      - >-
        turnserver --config=/etc/coturn/turnserver.conf
        --realm=$$TURN_REALM --external-ip=$$TURN_EXTERNAL_IP
        --static-auth-secret=$$TURN_SHARED_SECRET
        --cert=/run/secrets/tls/fullchain.pem --pkey=/run/secrets/tls/privkey.pem
    environment:
      TURN_REALM: ${TURN_REALM:?set TURN_REALM}
      TURN_EXTERNAL_IP: ${TURN_EXTERNAL_IP:?set TURN_EXTERNAL_IP}
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET:?set TURN_SHARED_SECRET}
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "5349:5349/udp"
      - "5349:5349/tcp"
      - "49160-49200:49160-49200/udp"
      - "49160-49200:49160-49200/tcp"
    volumes:
      - "./coturn.conf:/etc/coturn/turnserver.conf:ro"
      - "${TURN_TLS_DIR:?set TURN_TLS_DIR}:/run/secrets/tls:ro"

  migrate:
    build: { context: ../.., dockerfile: infra/docker/Dockerfile.api }
    image: tamreedy-api:local
    restart: "no"
    mem_limit: 512m   # one runaway service must not take the whole server down
    command: ["node", "infra/db/migrate.mjs"]
    environment:
      DATABASE_URL: postgresql://tamreedy:${POSTGRES_PASSWORD}@db:5432/tamreedy
    depends_on:
      db: { condition: service_healthy }

  api:
    image: tamreedy-api:local
    restart: unless-stopped
    mem_limit: 450m   # one runaway service must not take the whole server down
    environment: *api-env
    volumes: ["uploads:/data/uploads"]   # staff documents, AES-256-GCM encrypted at rest — back this up
    ports: ["${API_BIND:-127.0.0.1}:${API_PORT:-3000}:3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    build: { context: ../.., dockerfile: infra/docker/Dockerfile.worker }
    restart: unless-stopped
    mem_limit: 250m   # one runaway service must not take the whole server down
    environment:
      <<: *runtime-env
      GUARDIAN_ACK_SECONDS: ${GUARDIAN_ACK_SECONDS:-30}
      GUARDIAN_RETENTION_ENABLED: ${GUARDIAN_RETENTION_ENABLED:-false}
      GUARDIAN_CHECKINS_ENABLED: ${GUARDIAN_CHECKINS_ENABLED:-false}
      NODE_ENV: production
      DATABASE_URL: postgresql://tamreedy:${POSTGRES_PASSWORD}@db:5432/tamreedy
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      # Mount the existing Firebase file only in the worker. Set PUSH_ENABLED=false to disable delivery.
      FCM_SERVICE_ACCOUNT_FILE: /run/secrets/fcm.json
    volumes: ["${FCM_SERVICE_ACCOUNT_HOST_FILE:-./secrets/fcm.json}:/run/secrets/fcm.json:ro"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  admin:
    build: { context: ../.., dockerfile: infra/docker/Dockerfile.admin }
    restart: unless-stopped
    mem_limit: 64m   # one runaway service must not take the whole server down
    ports: ["${ADMIN_BIND:-127.0.0.1}:${ADMIN_PORT:-8080}:80"]
    depends_on: [api]

volumes:
  uploads:
  pg:
  redis:
