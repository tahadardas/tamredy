services:
  postgres:
    image: postgis/postgis:18-3.7
    environment:
      POSTGRES_DB: tamreedy
      POSTGRES_USER: tamreedy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_change_me}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["tamreedy_pg:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tamreedy -d tamreedy"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["tamreedy_redis:/data"]
  coturn:
    image: coturn/coturn:4.6-alpine
    command:
      - turnserver
      - --config=/etc/coturn/turnserver.conf
      - --realm=localhost
      - --static-auth-secret=${TURN_SHARED_SECRET:-dev_turn_secret_change_me}
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49160-49200:49160-49200/udp"
      - "49160-49200:49160-49200/tcp"
    volumes:
      - "./coturn.conf:/etc/coturn/turnserver.conf:ro"
volumes:
  tamreedy_pg:
  tamreedy_redis:
